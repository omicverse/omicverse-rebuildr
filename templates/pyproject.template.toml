[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "py<pkgname>"
version = "0.1.0"
description = "Pure-Python port of <UpstreamR> — <one-line of what it does>"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [
    { name = "Zehua Zeng", email = "starlitnightly@163.com" },
]
keywords = [
    "single-cell", "scRNA-seq", "<domain-keyword>",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

dependencies = [
    "numpy>=1.23",
    "scipy>=1.10",
    "pandas>=1.5",
    "anndata>=0.9",
    "scikit-learn>=1.2",
    "matplotlib>=3.6",
    "tqdm",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov", "ruff"]
scanpy = ["scanpy>=1.9"]

[project.urls]
Homepage = "https://github.com/omicverse/py-<PkgName>"
Repository = "https://github.com/omicverse/py-<PkgName>"
Issues = "https://github.com/omicverse/py-<PkgName>/issues"
"Upstream R package" = "<https://github.com/upstream/repo>"
"Upstream (omicverse)" = "https://github.com/Starlitnightly/omicverse"

[tool.setuptools.packages.find]
include = ["<pkgname>*"]
exclude = ["tests*", "examples*", "<pkgname>-ref*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::FutureWarning",
    "ignore::RuntimeWarning",
]
